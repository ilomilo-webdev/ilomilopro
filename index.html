    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {

                    colors: {

    <style>

        .btn-primary{background:#B91C1C;color:#fff;padding:.75rem 1.5rem;border-radius:.5rem;font-weight:600;transition:all .2s;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.95rem}

        .btn-secondary{background:transparent;color:#B91C1C;padding:.75rem 1.5rem;border-radius:.5rem;font-weight:600;transition:all .2s;border:1px solid #B91C1C;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.95rem}
        .btn-secondary:hover{background:rgba(185,28,28,.1)}
        .btn-gold{background:#D97706;color:#0A0A0A;padding:.5rem 1rem;border-radius:.375rem;font-weight:600;transition:all .2s;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem}

        .btn-sm{padding:.35rem .75rem;border-radius:.375rem;font-size:.8rem;font-weight:500;transition:all .2s;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
        .card-glow{position:relative}.card-glow::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(185,28,28,.5),transparent)}

        .toast.show{transform:translateX(0)}.toast-ok{background:#052e16;border-color:#166534;color:#4ade80}.toast-err{background:#2a0a0a;border-color:#7f1d1d;color:#f87171}.toast-info{background:#1a1400;border-color:#92400e;color:#fbbf24}

<script>
// ============================================================
// CATÁLOGO
// ============================================================
const CATALOGO = [
    { id:1, nombre:"Katana Antigua", precio:500000, desc:"Forjada por maestros artesanos de Seki" },
    { id:2, nombre:"Licencia de Negocio", precio:200000, desc:"Permiso para operar en Kabukicho" },
    { id:3, nombre:"Vehículo Ejecutivo", precio:1500000, desc:"Sedán blindado con matrícula de Shinjuku" },
    { id:4, nombre:"Seguro de Protección", precio:100000, desc:"Cobertura semanal de la familia" },
    { id:5, nombre:"Información Privilegiada", precio:300000, desc:"Datos confidenciales sobre la competencia" },
    { id:6, nombre:"Propiedad en Roppongi", precio:5000000, desc:"Local comercial en zona premium" },
    { id:7, nombre:"Arma de Fuego", precio:800000, desc:"Pistola compacta con munición incluida" },
    { id:8, nombre:"Reunión con el Oyabun", precio:1000000, desc:"Audiencia privada con el jefe de la familia" },
];

// ============================================================
// RED — jsonblob.com
// ============================================================
const API = 'https://jsonblob.com/api/jsonBlob';
let BLOB_ID = localStorage.getItem('ryuGinko_blob') || null;
const DEFAULT_DB = {
    users:[{cuenta:'0001',pin:'admin123',nombre:'Administración',saldo:0,creado:Date.now()}],
    transacciones:[], nextId:1
};

async function apiGet() {
    const r = await fetch(API+'/'+BLOB_ID);
    if(!r.ok) throw new Error('blob no encontrado');
    return r.json();
}
async function apiPut(db) {
    const r = await fetch(API+'/'+BLOB_ID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});
    if(!r.ok) throw new Error('error al guardar');
}
async function apiCreate() {
    const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DEFAULT_DB)});
    if(!r.ok) throw new Error('error al crear');
    const loc = r.headers.get('Location') || r.headers.get('location');
    return loc.split('/').pop();
}
async function apiJoin(id) {
    const r = await fetch(API+'/'+id);
    if(!r.ok) throw new Error('no encontrado');
    return r.json();
}

function showLoad(){document.getElementById('loading-overlay').classList.add('active')}
function hideLoad(){document.getElementById('loading-overlay').classList.remove('active')}

let busy = false;
async function withDB(fn) {
    if(busy) return {error:'Esperá, se está procesando otra operación'};
    busy = true; showLoad();
    try {
        const db = await apiGet();
        const result = fn(db);
        if(result && result.error) return result;
        await apiPut(db);
        return result;
    } catch(e) { return {error:'Error de conexión con el servidor. Verificá tu internet.'}; }
    finally { busy=false; hideLoad(); }
}

// ============================================================
// LÓGICA DEL BANCO
// ============================================================
function generarCuenta(db){const u=new Set(db.users.map(x=>x.cuenta));let c;do{c=String(Math.floor(Math.random()*10000)).padStart(4,'0')}while(u.has(c));return c}
function agregarTx(db,tipo,de,a,cant,desc){db.transacciones.push({id:db.nextId++,tipo,de,a:a||null,cantidad:Math.round(cant),desc,fecha:new Date().toISOString()});if(db.transacciones.length>2000)db.transacciones=db.transacciones.slice(-1500)}

async function registrar(nombre,pin){return withDB(db=>{nombre=nombre.trim();if(!nombre)return{error:'Nombre obligatorio'};if(!/^\d{4}$/.test(pin))return{error:'PIN debe ser 4 dígitos'};const c=generarCuenta(db);db.users.push({cuenta:c,pin,nombre,saldo:0,creado:Date.now()});agregarTx(db,'registro','0001',c,0,'Registro de '+nombre);return{ok:true,cuenta:c}})}
async function loginFn(cuenta,pin){try{const db=await apiGet();const c=cuenta.padStart(4,'0');const u=db.users.find(x=>x.cuenta===c&&x.pin===pin);if(!u)return{error:'Cuenta o contraseña incorrectos'};return{ok:true,user:u}}catch(e){return{error:'Error de conexión'}}}

// MODIFICADO: Admin (0001) puede transferirse a sí mismo
async function transferirFn(de,aC,cant){return withDB(db=>{const a=aC.padStart(4,'0');if(de===a && de!=='0001')return{error:'No podés transferirte a ti mismo'};const uF=db.users.find(x=>x.cuenta===de),uT=db.users.find(x=>x.cuenta===a);if(!uT)return{error:'Cuenta destino no existe'};cant=Math.round(cant);if(cant<=0)return{error:'Cantidad inválida'};if(uF.saldo<cant)return{error:'Saldo insuficiente (tenés '+fYen(uF.saldo)+')'};uF.saldo-=cant;uT.saldo+=cant;agregarTx(db,'transferencia',de,a,cant,uF.nombre+' envió a '+uT.nombre);return{ok:true}})}

async function comprarFn(cuenta,itemId){return withDB(db=>{const item=CATALOGO.find(i=>i.id===itemId);if(!item)return{error:'Producto no encontrado'};const u=db.users.find(x=>x.cuenta===cuenta);if(u.saldo<item.precio)return{error:'Saldo insuficiente'};u.saldo-=item.precio;agregarTx(db,'compra',cuenta,null,item.precio,'Compra: '+item.nombre);return{ok:true}})}
async function inyectarFn(cuenta,cant){return withDB(db=>{cant=Math.round(cant);if(cant<=0)return{error:'Cantidad inválida'};const u=db.users.find(x=>x.cuenta===cuenta);if(!u)return{error:'Usuario no encontrado'};u.saldo+=cant;agregarTx(db,'inyeccion','SISTEMA',cuenta,cant,'Inyección de fondos a '+u.nombre);return{ok:true}})}
async function drenarFn(cuenta,cant){return withDB(db=>{cant=Math.round(cant);if(cant<=0)return{error:'Cantidad inválida'};const u=db.users.find(x=>x.cuenta===cuenta);if(!u)return{error:'Usuario no encontrado'};if(u.saldo<cant)return{error:'Saldo insuficiente'};u.saldo-=cant;agregarTx(db,'drenaje',cuenta,'SISTEMA',cant,'Drenaje de fondos de '+u.nombre);return{ok:true}})}
async function eliminarFn(cuenta){return withDB(db=>{if(cuenta==='0001')return{error:'No podés eliminar admin'};const idx=db.users.findIndex(u=>u.cuenta===cuenta);if(idx===-1)return{error:'No encontrado'};const u=db.users[idx];let det='Cuenta eliminada: '+u.nombre;if(u.saldo>0){db.users.find(x=>x.cuenta==='0001').saldo+=u.saldo;det+=' (saldo '+fYen(u.saldo)+' recuperado)';agregarTx(db,'transferencia',cuenta,'0001',u.saldo,'Saldo recuperado al eliminar')}agregarTx(db,'eliminacion','0001',cuenta,0,det);db.users.splice(idx,1);return{ok:true}})}

// NUEVO: Pago masivo
async function bulkInyectarFn(cuentas, cant){return withDB(db=>{cant=Math.round(cant);if(cant<=0)return{error:'Cantidad inválida'};if(cuentas.length===0)return{error:'Seleccioná al menos un usuario'};let count=0;db.users.forEach(u=>{if(cuentas.includes(u.cuenta)){u.saldo+=cant;agregarTx(db,'inyeccion','SISTEMA',u.cuenta,cant,'Pago masivo');count++}});return{ok:true,count:count}})}

// ============================================================
// UTILIDADES
// ============================================================
function fYen(n){return'¥'+Math.round(n).toLocaleString('es-ES')}
function fFecha(iso){const d=new Date(iso);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function fTipo(t){return{registro:'Registro',transferencia:'Transferencia',compra:'Compra',inyeccion:'Inyección',drenaje:'Drenaje',eliminacion:'Eliminación'}[t]||t}
function tipoColor(t){return{registro:'text-green-400',transferencia:'text-blue-400',compra:'text-amber-400',inyeccion:'text-emerald-400',drenaje:'text-orange-400',eliminacion:'text-red-500'}[t]||'text-txt-m'}
function tipoIcon(t){return{registro:'fa-user-plus',transferencia:'fa-arrow-right-arrow-left',compra:'fa-bag-shopping',inyeccion:'fa-syringe',drenaje:'fa-faucet-drip',eliminacion:'fa-user-minus'}[t]||'fa-circle'}

function toast(msg,tipo='info'){const c=document.getElementById('toast-container'),el=document.createElement('div');el.className='toast toast-'+tipo;el.textContent=msg;c.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},3500)}
function showModal(title,sub,body,onOk,okText='Confirmar',cls=''){document.getElementById('modal-title').textContent=title;document.getElementById('modal-subtitle').textContent=sub||'';document.getElementById('modal-body').innerHTML=body;const b=document.getElementById('modal-confirm');b.textContent=okText;b.className='btn-primary !py-2 !px-4 !text-sm '+cls;b.onclick=()=>{if(onOk)onOk();closeModal()};document.getElementById('modal-overlay').classList.remove('hidden')}
function closeModal(){document.getElementById('modal-overlay').classList.add('hidden')}
function toggleVis(id,btn){const i=document.getElementById(id),s=i.type==='password';i.type=s?'text':'password';btn.innerHTML=s?'<i class="fa-solid fa-eye-slash text-sm"></i>':'<i class="fa-solid fa-eye text-sm"></i>'}

async function handleCreate(){

    try{

async function handleJoin(){

    showLoad();
    try{
        await apiJoin(code);
        BLOB_ID=code;localStorage.setItem('ryuGinko_blob',code);
        hideLoad();toast('Conectado al banco correctamente','ok');
        showScreen('login');
    }catch(e){hideLoad();toast('Código inválido o banco no encontrado','err')}
}

// ============================================================
// HANDLERS — LOGIN / REGISTRO / TRANSFERIR / COMPRAR
// ============================================================
async function handleLogin(){
    const cuenta=document.getElementById('login-cuenta').value.trim(),pin=document.getElementById('login-pin').value.trim();
    if(!cuenta||!pin)return toast('Completa todos los campos','err');
    showLoad();
    const res=await loginFn(cuenta,pin);
    hideLoad();
    if(res.error)return toast(res.error,'err');
    sesion={cuenta:res.user.cuenta,nombre:res.user.nombre,esAdmin:res.user.cuenta==='0001'};
    if(sesion.esAdmin){setAdminTab('control');showScreen('admin')}
    else{document.getElementById('user-nav-name').textContent=res.user.nombre;document.getElementById('user-nav-cuenta').textContent=res.user.cuenta;setUserTab('inicio');showScreen('user')}
}

async function handleRegister(){
    const nombre=document.getElementById('reg-nombre').value.trim(),pin=document.getElementById('reg-pin').value.trim(),pin2=document.getElementById('reg-pin2').value.trim();
    if(!nombre||!pin||!pin2)return toast('Completa todos los campos','err');
    if(pin!==pin2)return toast('Los PINs no coinciden','err');
    const res=await registrar(nombre,pin);
    if(res.error)return toast(res.error,'err');
    toast('Cuenta creada: #'+res.cuenta,'ok');
    document.getElementById('reg-nombre').value='';document.getElementById('reg-pin').value='';document.getElementById('reg-pin2').value='';
    showScreen('login');document.getElementById('login-cuenta').value=res.cuenta;
}

async function handleTransferir(){
    const dest=document.getElementById('tf-dest').value.trim(),amt=parseInt(document.getElementById('tf-monto').value);
    if(!dest)return toast('Ingresa cuenta destino','err');
    if(!amt||amt<=0)return toast('Cantidad inválida','err');
    showModal('Confirmar transferencia',fYen(amt)+' a #'+dest.padStart(4,'0'),'<p class="text-txt-d text-sm">Se descuenta de tu saldo.</p>',async()=>{
        const r=await transferirFn(sesion.cuenta,dest,amt);
        if(r.error)return toast(r.error,'err');
        toast('Transferencia realizada','ok');document.getElementById('tf-dest').value='';document.getElementById('tf-monto').value='';renderUser()
    },'Transferir')
}

function handleCompra(itemId){const item=CATALOGO.find(i=>i.id===itemId);if(!item)return;showModal('Confirmar compra',item.nombre+' — '+fYen(item.precio),'<p class="text-txt-d text-sm">'+item.desc+'</p>',async()=>{const r=await comprarFn(sesion.cuenta,itemId);if(r.error)return toast(r.error,'err');toast('Compra realizada','ok');renderUser()},'Comprar')}

function admTransferir(c){const db_cache=lastDB;const u=db_cache?db_cache.users.find(x=>x.cuenta===c):null;const admin=db_cache?db_cache.users.find(x=>x.cuenta==='0001'):null;if(!u)return;showModal('Transferir a '+u.nombre,'Tu saldo: '+fYen(admin?admin.saldo:0),'<input id="adm-tf-amt" type="number" class="input-field mt-2" placeholder="Cantidad" min="0">',async()=>{const amt=parseInt(document.getElementById('adm-tf-amt').value);if(!amt||amt<=0)return toast('Cantidad inválida','err');const r=await transferirFn('0001',c,amt);if(r.error)return toast(r.error,'err');toast('Transferido '+fYen(amt)+' a '+u.nombre,'ok');renderAdmin()},'Transferir')}
function admInyectar(c){const db_cache=lastDB;const u=db_cache?db_cache.users.find(x=>x.cuenta===c):null;if(!u)return;showModal('Inyectar fondos a '+u.nombre,'Cuenta #'+c+' — Saldo: '+fYen(u.saldo),'<p class="text-xs text-emerald-400 mb-2"><i class="fa-solid fa-circle-info mr-1"></i>Crea dinero nuevo. No se descuenta de nadie.</p><input id="adm-iny-amt" type="number" class="input-field" placeholder="Cantidad" min="0">',async()=>{const amt=parseInt(document.getElementById('adm-iny-amt').value);if(!amt||amt<=0)return toast('Cantidad inválida','err');const r=await inyectarFn(c,amt);if(r.error)return toast(r.error,'err');toast('Inyectados '+fYen(amt),'ok');renderAdmin()},'Inyectar')}
function admDrenar(c){const db_cache=lastDB;const u=db_cache?db_cache.users.find(x=>x.cuenta===c):null;if(!u)return;showModal('Drenar fondos de '+u.nombre,'Saldo: '+fYen(u.saldo),'<p class="text-xs text-orange-400 mb-2"><i class="fa-solid fa-circle-info mr-1"></i>El dinero sale del sistema.</p><input id="adm-drn-amt" type="number" class="input-field" placeholder="Cantidad" min="0">',async()=>{const amt=parseInt(document.getElementById('adm-drn-amt').value);if(!amt||amt<=0)return toast('Cantidad inválida','err');const r=await drenarFn(c,amt);if(r.error)return toast(r.error,'err');toast('Drenados '+fYen(amt),'ok');renderAdmin()},'Drenar','!bg-orange-900 hover:!bg-orange-800')}
function admEliminar(c){const db_cache=lastDB;const u=db_cache?db_cache.users.find(x=>x.cuenta===c):null;if(!u)return;const msg=u.saldo>0?'<p class="text-amber-400 text-xs mt-2"><i class="fa-solid fa-circle-info mr-1"></i>Saldo de '+fYen(u.saldo)+' recuperado por admin.</p>':'';showModal('Eliminar a '+u.nombre,'#'+c,'<p class="text-txt-d text-sm">Acción permanente.</p>'+msg,async()=>{const r=await eliminarFn(c);if(r.error)return toast(r.error,'err');toast('Cuenta eliminada','ok');renderAdmin()},'Eliminar','!bg-red-900 hover:!bg-red-800')}

// NUEVO HANDLER: Pago Masivo
function openBulkModal(){
    const db = lastDB;
    if(!db) return;
    const usersHtml = db.users.map(u => 
        `<div class="bulk-user-item">
            <input type="checkbox" value="${u.cuenta}" id="chk-${u.cuenta}">
            <label for="chk-${u.cuenta}" class="text-sm text-txt cursor-pointer flex-1 truncate">${u.nombre} <span class="text-txt-d text-xs">#${u.cuenta}</span></label>
         </div>`
    ).join('');

    const body = `
        <div class="mb-3">
            <input id="bulk-amount" type="number" class="input-field" placeholder="Cantidad a inyectar a cada uno" min="0">
        </div>
        <div class="text-txt-d text-xs mb-2 uppercase tracking-wider">Seleccionar usuarios:</div>
        <div class="bulk-user-list scrollbar-thin border border-bdr rounded-lg bg-card-alt p-2">
            ${usersHtml}
        </div>
    `;
    
    showModal('Pago Masivo','Inyecta dinero a varias cuentas a la vez',body, async () => {
        const amt = parseInt(document.getElementById('bulk-amount').value);
        if(!amt || amt <= 0) return toast('Cantidad inválida','err');
        
        const checked = Array.from(document.querySelectorAll('#modal-body input:checked')).map(cb => cb.value);
        if(checked.length === 0) return toast('Seleccioná al menos un usuario','err');

        const r = await bulkInyectarFn(checked, amt);
        if(r.error) return toast(r.error,'err');
        toast(`Inyectado ${fYen(amt)} a ${r.count} usuarios`,'ok');
        renderAdmin();
    },'Confirmar Pago');
}

00/30'}"><i class="fa-solid ${tipoIcon(t.tipo)} text-xs ${e?'text-green-400':'text-red-400'}"></i></div><div class="flex-1 min-w-0"><p class="text-sm text-txt truncate">${t.desc}</p><p class="text-xs text-txt-d">${fFecha(t.fecha)}</p></div><p class="text-sm font-semibold ${e?'text-green-400':'text-red-400'} whitespace-nowrap">${e?'+':'-'}${fYen(t.cantidad)}</p></div>`}).join('')}</div></div>`:`<div class="bg-card border border-bdr rounded-xl p-8 text-center"><i class="fa-solid fa-inbox text-txt-d text-2xl mb-2"></i><p class="text-txt-d text-sm">Sin movimientos aun</p></div>`}`;

async function renderAdmin(){

    try{lastDB=await apiGet()}catch(e){hideLoad();toast('Error de conexión','err');return}
    hideLoad();
    const db=lastDB,el=document.getElementById('admin-content');el.className='fade-in';

    if(adminTab==='control'){
        const admin=db.users.find(x=>x.cuenta==='0001'),otros=db.users.filter(u=>u.cuenta!=='0001'),total=otros.reduce((s,u)=>s+u.saldo,0);
        // Agregado botón de PAGO MASIVO
        el.innerHTML=`<div class="bg-gradient-to-br from-card to-card-alt border border-gold/20 rounded-xl p-6 sm:p-8 text-center card-gold relative overflow-hidden mb-5"><p class="text-txt-d text-xs uppercase tracking-[0.25em] mb-1">Tu saldo de Administración</p><p class="text-3xl sm:text-4xl font-bold text-gold-b font-display">${fYen(admin.saldo)}</p><p class="text-txt-d text-xs mt-2">Desde aquí enviás dinero a los miembros</p></div><div class="grid grid-cols-3 gap-3 mb-5"><div class="bg-card border border-bdr rounded-lg p-3 text-center"><p class="text-txt-d text-[10px] uppercase tracking-wider">Miembros</p><p class="text-lg font-bold text-txt mt-0.5">${otros.length}</p></div><div class="bg-card border border-bdr rounded-lg p-3 text-center"><p class="text-txt-d text-[10px] uppercase tracking-wider">En sus cuentas</p><p class="text-lg font-bold text-gold-b mt-0.5">${fYen(total)}</p></div><div class="bg-card border border-bdr rounded-lg p-3 text-center"><p class="text-txt-d text-[10px] uppercase tracking-wider">Movimientos</p><p class="text-lg font-bold text-txt mt-0.5">${db.transacciones.length}</p></div></div><div class="mb-4"><button onclick="openBulkModal()" class="w-full bg-emerald-900/20 border border-emerald-500/50 text-emerald-400 hover:bg-emerald-900/40 font-semibold py-3 rounded-lg transition-colors"><i class="fa-solid fa-money-bill-transfer mr-2"></i>Pago Masivo (Simultáneo)</button></div><div class="bg-card border border-bdr rounded-xl overflow-hidden card-gold"><div class="px-4 py-3 border-b border-bdr flex items-center justify-between"><p class="text-sm font-semibold text-txt-m">Todos los usuarios</p><span class="text-[10px] text-txt-d uppercase tracking-wider">Contraseñas visibles</span></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-bdr text-txt-d text-[10px] uppercase tracking-wider"><th class="text-left px-4 py-2.5 font-medium">Cuenta</th><th class="text-left px-4 py-2.5 font-medium">Nombre</th><th class="text-left px-4 py-2.5 font-medium">Contraseña</th><th class="text-right px-4 py-2.5 font-medium">Saldo</th><th class="text-right px-4 py-2.5 font-medium">Acciones</th></tr></thead><tbody class="divide-y divide-bdr/50">${otros.length===0?'<tr><td colspan="5" class="px-4 py-8 text-center text-txt-d text-sm">No hay miembros registrados</td></tr>':''}${otros.map(u=>`<tr class="table-row transition-colors"><td class="px-4 py-3 font-mono text-ryu-b font-semibold">#${u.cuenta}</td><td class="px-4 py-3 text-txt">${u.nombre}</td><td class="px-4 py-3 font-mono text-amber-400 bg-amber-900/5 text-center">${u.pin}</td><td class="px-4 py-3 text-right font-semibold ${u.saldo>0?'text-gold-b':'text-txt-d'}">${fYen(u.saldo)}</td><td class="px-4 py-3 text-right"><div class="flex items-center justify-end gap-1.5 flex-wrap"><button onclick="admTransferir('${u.cuenta}')" class="adm-action bg-blue-900/40 text-blue-400 hover:bg-blue-900/70"><i class="fa-solid fa-arrow-right text-[9px]"></i>Enviar</button><button onclick="admInyectar('${u.cuenta}')" class="adm-action bg-emerald-900/40 text-emerald-400 hover:bg-emerald-900/70"><i class="fa-solid fa-plus text-[9px]"></i>Inyectar</button><button onclick="admDrenar('${u.cuenta}')" class="adm-action bg-orange-900/40 text-orange-400 hover:bg-orange-900/70"><i class="fa-solid fa-minus text-[9px]"></i>Drenar</button><button onclick="admEliminar('${u.cuenta}')" class="adm-action bg-card-alt text-txt-d hover:text-red-400 hover:bg-red-900/20"><i class="fa-solid fa-trash text-[9px]"></i></button></div></td></tr>`).join('')}</tbody></table></div></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4"><div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1"></span><span class="text-[10px] text-txt-d">Enviar = tu saldo</span></div><div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1"></span><span class="text-[10px] text-txt-d">Inyectar = dinero nuevo</span></div><div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-orange-400 mr-1"></span><span class="text-[10px] text-txt-d">Drenar = elimina dinero</span></div><div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span><span class="text-[10px] text-txt-d">Eliminar = borra cuenta</span></div></div>`;
    }
    else if(adminTab==='movimientos'){
        const txs=[...db.transacciones].reverse();
        el.innerHTML=`<div class="mb-4"><h2 class="font-display text-lg text-txt mb-1">Registro Completo</h2><p class="text-txt-d text-sm">${txs.length} movimientos</p></div>${txs.length>0?`<div class="bg-card border border-bdr rounded-xl overflow-hidden card-glow"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-bdr text-txt-d text-[10px] uppercase tracking-wider"><th class="text-left px-4 py-2.5 font-medium">ID</th><th class="text-left px-4 py-2.5 font-medium">Fecha</th><th class="text-left px-4 py-2.5 font-medium">Tipo</th><th class="text-left px-4 py-2.5 font-medium">Detalle</th><th class="text-right px-4 py-2.5 font-medium">Cantidad</th></tr></thead><tbody class="divide-y divide-bdr/50">${txs.map(t=>`<tr class="table-row transition-colors"><td class="px-4 py-2.5 font-mono text-txt-d text-xs">#${t.id}</td><td class="px-4 py-2.5 text-txt-d text-xs whitespace-nowrap">${fFecha(t.fecha)}</td><td class="px-4 py-2.5"><span class="${tipoColor(t.tipo)} text-xs font-medium uppercase tracking-wider">${fTipo(t.tipo)}</span></td><td class="px-4 py-2.5 text-txt-m text-xs max-w-[250px] truncate">${t.desc}</td><td class="px-4 py-2.5 text-right font-mono font-semibold ${t.cantidad>0?'text-txt':'text-txt-d'}">${t.cantidad>0?fYen(t.cantidad):'---'}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="bg-card border border-bdr rounded-xl p-8 text-center"><p class="text-txt-d text-sm">Sin movimientos</p></div>`}`;
    }
    // SECCIÓN RED ELIMINADA
}

// ============================================================
// ENTER KEY
// ============================================================
document.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    if(document.getElementById('screen-lobby').classList.contains('active'))handleJoin();
    else if(document.getElementById('screen-login').classList.contains('active'))handleLogin();
    else if(document.getElementById('screen-register').classList.contains('active'))handleRegister();
});

// ============================================================
// INICIALIZACIÓN
// ============================================================
async function init(){
    if(BLOB_ID){
        showLoad();
        try{await apiGet();hideLoad();showScreen('login')}
        catch(e){hideLoad();localStorage.removeItem('ryuGinko_blob');BLOB_ID=null;showScreen('lobby');toast('El banco anterior no existe. Creá uno nuevo.','err')}
    }else{showScreen('lobby')}
}
init();
</script>
