<script>
// ============================================================
//  CONFIGURACIÓN DE SUPABASE (TUS DATOS)
// ============================================================
const SUPABASE_URL = 'https://cjpcskqmiuhmioedyspv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqcGNza3FtaXVobWlvZWR5c3B2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NjE1NTQsImV4cCI6MjA5MTUzNzU1NH0.0Z8o8GLAUAMg-2pDQHA0_HPsI03cEyvgiP4heJwzTyY';

// Crear el cliente de Supabase
const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// CATÁLOGO
// ============================================================
const CATALOGO = [
    { id:1, nombre:"Katana Antigua", precio:500000, desc:"Forjada por maestros artesanos de Seki" },
    { id:2, nombre:"Licencia de Negocio", precio:200000, desc:"Permiso para operar en Kabukicho" },
    { id:3, nombre:"Vehículo Ejecutivo", precio:1500000, desc:"Sedán blindado con matrícula de Shinjuku" },
    { id:4, nombre:"Seguro de Protección", precio:100000, desc:"Cobertura semanal de la familia" },
    { id:5, nombre:"Información Privilegiada", precio:300000, desc:"Datos confidenciales sobre la competencia" },
    { id:6, nombre:"Propiedad en Roppongi", precio:5000000, desc:"Local comercial en zona premium" },
    { id:7, nombre:"Arma de Fuego", precio:800000, desc:"Pistola compacta con munición incluida" },
    { id:8, nombre:"Reunión con el Oyabun", precio:1000000, desc:"Audiencia privada con el jefe de la familia" },
];

// ============================================================
// FUNCIONES AUXILIARES
// ============================================================
async function cargarTodo() {
    try {
        const [resUsers, resTx] = await Promise.all([
            supabase.from('users').select('*'),
            supabase.from('transacciones').select('*').order('fecha', { ascending: false }) // Orden descendente para ver lo último primero
        ]);
        if (resUsers.error) throw resUsers.error;
        if (resTx.error) throw resTx.error;
        return {
            users: resUsers.data || [],
            transacciones: resTx.data || []
        };
    } catch (e) {
        console.error('Error cargando datos:', e);
        toast('Error al conectar con la base de datos. Verifica que las tablas existan.', 'err');
        return { users: [], transacciones: [] };
    }
}

async function guardarUsuario(user) {
    const { error } = await supabase.from('users').upsert(user, { onConflict: 'cuenta' });
    if (error) { console.error(error); toast("Error al guardar usuario: " + error.message, "err"); return false; }
    return true;
}

async function guardarTx(tx) {
    const { error } = await supabase.from('transacciones').insert([{
        tipo: tx.tipo,
        de: tx.de || null,
        a: tx.a || null,
        cantidad: tx.cantidad,
        descripcion: tx.descripcion, // Campo corregido
        fecha: tx.fecha || new Date().toISOString()
    }]);
    if (error) { console.error(error); toast("Error al guardar transacción: " + error.message, "err"); return false; }
    return true;
}

// Crear admin si no existe
async function inicializarAdmin() {
    try {
        const { data, error } = await supabase.from('users').select('cuenta').eq('cuenta', '0001');
        if (error) throw error;
        if (!data || data.length === 0) {
            const nuevoAdmin = {
                cuenta: '0001',
                pin: 'admin123',
                nombre: 'Administración',
                saldo: 0,
                creado: new Date().toISOString(),
                es_admin: true
            };
            await guardarUsuario(nuevoAdmin);
            console.log('Admin creado automáticamente');
        }
    } catch (e) {
        console.warn('No se pudo verificar/crear admin (quizás las tablas no existen aún):', e);
    }
}

// ============================================================
// LÓGICA DEL BANCO
// ============================================================
async function generarCuenta() {
    const { data } = await supabase.from('users').select('cuenta');
    const usadas = new Set((data || []).map(u => u.cuenta));
    let c;
    do { c = String(Math.floor(Math.random()*10000)).padStart(4,'0'); } while (usadas.has(c));
    return c;
}

async function login(cuenta, pin) {
    const c = cuenta.padStart(4,'0');
    const { data, error } = await supabase.from('users').select('*').eq('cuenta', c).eq('pin', pin).single();
    if (error || !data) return { error: 'Cuenta o contraseña incorrectos' };
    return { ok: true, user: data };
}

async function registrar(nombre, pin) {
    nombre = nombre.trim();
    if (!nombre) return { error: 'El nombre es obligatorio' };
    if (!/^\d{4}$/.test(pin)) return { error: 'El PIN debe ser exactamente 4 dígitos' };
    const cuenta = await generarCuenta();
    const nuevo = {
        cuenta, pin, nombre, saldo: 0,
        creado: new Date().toISOString(),
        es_admin: false
    };
    const ok = await guardarUsuario(nuevo);
    if (!ok) return { error: 'Error al crear la cuenta' };
    await guardarTx({
        tipo: 'registro', de: '0001', a: cuenta, cantidad: 0,
        descripcion: 'Registro de ' + nombre
    });
    return { ok: true, cuenta };
}

async function transferir(deCuenta, aCuenta, cantidad) {
    const aC = aCuenta.padStart(4,'0');
    // MODIFICACIÓN: Permitimos transferir a uno mismo si es necesario (flexibilidad admin)
    // if (deCuenta === aC) return { error: 'No puedes transferirte a ti mismo' }; 
    
    const { data: uFrom } = await supabase.from('users').select('*').eq('cuenta', deCuenta).single();
    const { data: uTo } = await supabase.from('users').select('*').eq('cuenta', aC).single();
    
    if (!uFrom) return { error: 'Tu cuenta no existe' };
    if (!uTo) return { error: 'Cuenta destino no existe' };
    cantidad = Math.round(cantidad);
    if (cantidad <= 0) return { error: 'Cantidad inválida' };
    if (uFrom.saldo < cantidad) return { error: 'Saldo insuficiente' };
    
    uFrom.saldo -= cantidad;
    uTo.saldo += cantidad;
    await guardarUsuario(uFrom);
    await guardarUsuario(uTo);
    await guardarTx({
        tipo: 'transferencia', de: deCuenta, a: aC, cantidad,
        descripcion: `${uFrom.nombre} envió a ${uTo.nombre}`
    });
    return { ok: true };
}

async function comprar(cuenta, itemId) {
    const item = CATALOGO.find(i => i.id === itemId);
    if (!item) return { error: 'Producto no encontrado' };
    const { data: u } = await supabase.from('users').select('*').eq('cuenta', cuenta).single();
    if (!u) return { error: 'Usuario no encontrado' };
    if (u.saldo < item.precio) return { error: 'Saldo insuficiente' };
    u.saldo -= item.precio;
    await guardarUsuario(u);
    await guardarTx({
        tipo: 'compra', de: cuenta, a: null, cantidad: item.precio,
        descripcion: 'Compra: ' + item.nombre
    });
    return { ok: true };
}

async function inyectar(cuenta, cantidad) {
    cantidad = Math.round(cantidad);
    if (cantidad <= 0) return { error: 'Cantidad inválida' };
    const { data: u } = await supabase.from('users').select('*').eq('cuenta', cuenta).single();
    if (!u) return { error: 'Usuario no encontrado' };
    u.saldo += cantidad;
    await guardarUsuario(u);
    await guardarTx({
        tipo: 'inyeccion', de: 'SISTEMA', a: cuenta, cantidad,
        descripcion: `Inyección de fondos a ${u.nombre}`
    });
    return { ok: true };
}

async function drenar(cuenta, cantidad) {
    cantidad = Math.round(cantidad);
    if (cantidad <= 0) return { error: 'Cantidad inválida' };
    const { data: u } = await supabase.from('users').select('*').eq('cuenta', cuenta).single();
    if (!u) return { error: 'Usuario no encontrado' };
    if (u.saldo < cantidad) return { error: 'Saldo insuficiente' };
    u.saldo -= cantidad;
    await guardarUsuario(u);
    await guardarTx({
        tipo: 'drenaje', de: cuenta, a: 'SISTEMA', cantidad,
        descripcion: `Drenaje de fondos de ${u.nombre}`
    });
    return { ok: true };
}

async function eliminarUsuario(cuenta) {
    if (cuenta === '0001') return { error: 'No puedes eliminar al admin' };
    const { data: u } = await supabase.from('users').select('*').eq('cuenta', cuenta).single();
    if (!u) return { error: 'Usuario no encontrado' };
    // Recuperar saldo al admin si tiene
    if (u.saldo > 0) {
        const { data: admin } = await supabase.from('users').select('*').eq('cuenta', '0001').single();
        if(admin) {
            admin.saldo += u.saldo;
            await guardarUsuario(admin);
            await guardarTx({
                tipo: 'transferencia', de: cuenta, a: '0001', cantidad: u.saldo,
                descripcion: `Saldo recuperado al eliminar cuenta de ${u.nombre}`
            });
        }
    }
    await guardarTx({
        tipo: 'eliminacion', de: '0001', a: cuenta, cantidad: 0,
        descripcion: `Cuenta eliminada: ${u.nombre}`
    });
    const { error } = await supabase.from('users').delete().eq('cuenta', cuenta);
    if (error) return { error: 'Error al eliminar: ' + error.message };
    return { ok: true };
}

// ============================================================
// UTILIDADES
// ============================================================
function fYen(n) { return '¥' + Math.round(n).toLocaleString('es-ES'); }
function fFecha(iso) { const d = new Date(iso); return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function fTipo(t) { return { registro:'Registro', transferencia:'Transferencia', compra:'Compra', inyeccion:'Inyección', drenaje:'Drenaje', eliminacion:'Eliminación' }[t] || t; }
function tipoColor(t) { return { registro:'text-green-400', transferencia:'text-blue-400', compra:'text-amber-400', inyeccion:'text-emerald-400', drenaje:'text-orange-400', eliminacion:'text-red-500' }[t] || 'text-txt-m'; }
function tipoIcon(t) { return { registro:'fa-user-plus', transferencia:'fa-arrow-right-arrow-left', compra:'fa-bag-shopping', inyeccion:'fa-syringe', drenaje:'fa-faucet-drip', eliminacion:'fa-user-minus' }[t] || 'fa-circle'; }

function toast(msg, tipo='info') {
    const c = document.getElementById('toast-container'), el = document.createElement('div');
    el.className = 'toast toast-' + tipo; el.textContent = msg; c.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 5000);
}

function showModal(title, subtitle, bodyHTML, onConfirm, confirmText='Confirmar', extraClass='') {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-subtitle').textContent = subtitle || '';
    document.getElementById('modal-body').innerHTML = bodyHTML;
    const btn = document.getElementById('modal-confirm');
    btn.textContent = confirmText;
    btn.className = 'btn-primary !py-2 !px-4 !text-sm ' + extraClass;
    btn.onclick = () => { if (onConfirm) onConfirm(); closeModal(); };
    document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function toggleVis(id, btn) {
    const inp = document.getElementById(id), s = inp.type === 'password';
    inp.type = s ? 'text' : 'password';
    btn.innerHTML = s ? '<i class="fa-solid fa-eye-slash text-sm"></i>' : '<i class="fa-solid fa-eye text-sm"></i>';
}

let sesion = null, userTab = 'inicio', adminTab = 'control';

function showScreen(n) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('screen-'+n).classList.add('active'); }
function setUserTab(t) { userTab = t; document.querySelectorAll('#screen-user .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); renderUser(); }
function setAdminTab(t) { adminTab = t; document.querySelectorAll('#screen-admin .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); renderAdmin(); }
function cerrarSesion() { sesion = null; document.getElementById('login-cuenta').value=''; document.getElementById('login-pin').value=''; showScreen('login'); }

// ============================================================
// HANDLERS
// ============================================================
async function handleLogin() {
    const cuenta = document.getElementById('login-cuenta').value.trim();
    const pin = document.getElementById('login-pin').value.trim();
    if (!cuenta || !pin) return toast('Completa todos los campos','err');
    const res = await login(cuenta, pin);
    if (res.error) return toast(res.error,'err');
    sesion = { cuenta: res.user.cuenta, nombre: res.user.nombre, esAdmin: res.user.es_admin === true };
    if (sesion.esAdmin) { setAdminTab('control'); showScreen('admin'); }
    else { document.getElementById('user-nav-name').textContent=res.user.nombre; document.getElementById('user-nav-cuenta').textContent=res.user.cuenta; setUserTab('inicio'); showScreen('user'); }
}

async function handleRegister() {
    const nombre=document.getElementById('reg-nombre').value.trim(), pin=document.getElementById('reg-pin').value.trim(), pin2=document.getElementById('reg-pin2').value.trim();
    if (!nombre||!pin||!pin2) return toast('Completa todos los campos','err');
    if (pin!==pin2) return toast('Los PINs no coinciden','err');
    const res = await registrar(nombre, pin);
    if (res.error) return toast(res.error,'err');
    toast('Cuenta creada: #' + res.cuenta,'ok');
    document.getElementById('reg-nombre').value=''; document.getElementById('reg-pin').value=''; document.getElementById('reg-pin2').value='';
    showScreen('login'); document.getElementById('login-cuenta').value=res.cuenta;
}

async function handleTransferir() {
    const dest=document.getElementById('tf-dest').value.trim(), amt=parseInt(document.getElementById('tf-monto').value);
    if (!dest) return toast('Ingresa la cuenta destino','err');
    if (!amt||amt<=0) return toast('Ingresa una cantidad válida','err');
    showModal('Confirmar transferencia', fYen(amt)+' a cuenta #'+dest.padStart(4,'0'), '<p class="text-txt-d text-sm">Se descontará de tu saldo.</p>', async () => {
        const r = await transferir(sesion.cuenta, dest, amt);
        if (r.error) return toast(r.error,'err');
        toast('Transferencia realizada','ok');
        document.getElementById('tf-dest').value=''; document.getElementById('tf-monto').value=''; renderUser();
    }, 'Transferir');
}

async function handleCompra(itemId) {
    const item=CATALOGO.find(i=>i.id===itemId); if(!item) return;
    showModal('Confirmar compra', item.nombre+' — '+fYen(item.precio), '<p class="text-txt-d text-sm">'+item.desc+'</p>', async () => {
        const r = await comprar(sesion.cuenta, itemId);
        if(r.error) return toast(r.error,'err');
        toast('Compra realizada: '+item.nombre,'ok'); renderUser();
    }, 'Comprar');
}

            <div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1"></span><span class="text-[10px] text-txt-d">Enviar = de tu saldo</span></div>
            <div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1"></span><span class="text-[10px] text-txt-d">Inyectar = dinero nuevo</span></div>
            <div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-orange-400 mr-1"></span><span class="text-[10px] text-txt-d">Drenar = elimina dinero</span></div>
            <div class="bg-card border border-bdr rounded-lg p-2.5 text-center"><span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span><span class="text-[10px] text-txt-d">Eliminar = borra cuenta</span></div>
        </div>`;
    }
    else if (adminTab === 'movimientos') {
        const txs = db.transacciones; // Ya vienen ordenados por cargarTodo
        el.innerHTML = `<div class="mb-4"><h2 class="font-display text-lg text-txt mb-1">Registro Completo</h2><p class="text-txt-d text-sm">${txs.length} movimientos registrados</p></div>
        ${txs.length>0?`<div class="bg-card border border-bdr rounded-xl overflow-hidden card-glow"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b border-bdr text-txt-d text-[10px] uppercase tracking-wider"><th class="text-left px-4 py-2.5 font-medium">ID</th><th class="text-left px-4 py-2.5 font-medium">Fecha</th><th class="text-left px-4 py-2.5 font-medium">Tipo</th><th class="text-left px-4 py-2.5 font-medium">Detalle</th><th class="text-right px-4 py-2.5 font-medium">Cantidad</th></tr></thead><tbody class="divide-y divide-bdr/50">${txs.map(t=>`<tr class="table-row transition-colors"><td class="px-4 py-2.5 font-mono text-txt-d text-xs">#${t.id}</td><td class="px-4 py-2.5 text-txt-d text-xs whitespace-nowrap">${fFecha(t.fecha)}</td><td class="px-4 py-2.5"><span class="${tipoColor(t.tipo)} text-xs font-medium uppercase tracking-wider">${fTipo(t.tipo)}</span></td><td class="px-4 py-2.5 text-txt-m text-xs max-w-[250px] truncate">${t.descripcion || t.desc}</td><td class="px-4 py-2.5 text-right font-mono font-semibold ${t.cantidad>0?'text-txt':'text-txt-d'}">${t.cantidad>0?fYen(t.cantidad):'---'}</td></tr>`).join('')}</tbody></table></div></div>`:`<div class="bg-card border border-bdr rounded-xl p-8 text-center"><p class="text-txt-d text-sm">Sin movimientos</p></div>`}`;
    }
    else if (adminTab === 'sincronizar') {
        el.innerHTML = `
        <div class="mb-5"><h2 class="font-display text-lg text-txt mb-1">Sincronizar Datos</h2><p class="text-txt-d text-xs leading-relaxed max-w-lg">Los datos están en la nube (Supabase). No necesitas exportar/importar manualmente. Todos los usuarios conectados ven los mismos datos en tiempo real.</p></div>
        <div class="bg-card border border-bdr rounded-xl p-5 card-gold">
            <h3 class="text-sm font-semibold text-gold-b mb-3"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Estado de la nube</h3>
            <p class="text-txt-m text-sm">Usuarios totales: ${db.users.length}</p>
            <p class="text-txt-m text-sm mt-1">Transacciones totales: ${db.transacciones.length}</p>
            <p class="text-txt-d text-xs mt-4"><i class="fa-solid fa-circle-check text-green-500 mr-1"></i>Conectado a Supabase</p>
        </div>`;
    }
}

// ============================================================
// INICIALIZACIÓN
// ============================================================
(async function init() {
    try {
        await inicializarAdmin();
        // Ocultar loader cuando estamos listos
        document.getElementById('loading-overlay').style.display = 'none';
        showScreen('login');
    } catch (error) {
        console.error(error);
        document.getElementById('loading-overlay').innerHTML = `<p class="text-red-500">Error de inicio. Revisa la consola.</p>`;
    }
})();

// Enter para acceder
document.addEventListener('keydown', e => {
    if(e.key!=='Enter') return;
    if(document.getElementById('screen-login').classList.contains('active')) handleLogin();
    else if(document.getElementById('screen-register').classList.contains('active')) handleRegister();
});
</script>
</body>
</html>
