    <style>
        *{box-sizing:border-box}
        body{background:radial-gradient(ellipse at 85% 0%,rgba(185,28,28,.07) 0%,transparent 50%),radial-gradient(ellipse at 15% 100%,rgba(185,28,28,.04) 0%,transparent 50%),#0A0A0A;font-family:'DM Sans',sans-serif}

        .screen{display:none}.screen.active{display:flex}
        .tab-btn{transition:all .2s}.tab-btn.active{color:#F59E0B;border-bottom:2px solid #F59E0B}.tab-btn:hover:not(.active){color:#E5E5E5}
        input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type="number"]{-moz-appearance:textfield}
        .input-field{background:#1A1A1A;border:1px solid #252525;color:#F5F5F5;border-radius:.5rem;padding:.75rem 1rem;width:100%;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif;font-size:.95rem}
        .input-field:focus{border-color:#B91C1C}.input-field::placeholder{color:#525252}
        .btn-primary{background:#B91C1C;color:#fff;padding:.75rem 1.5rem;border-radius:.5rem;font-weight:600;transition:all .2s;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.95rem}
        .btn-primary:hover{background:#DC2626;transform:translateY(-1px)}.btn-primary:active{transform:translateY(0)}
        .btn-secondary{background:transparent;color:#B91C1C;padding:.75rem 1.5rem;border-radius:.5rem;font-weight:600;transition:all .2s;border:1px solid #B91C1C;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.95rem}
        .btn-secondary:hover{background:rgba(185,28,28,.1)}
        .btn-gold{background:#D97706;color:#0A0A0A;padding:.5rem 1rem;border-radius:.375rem;font-weight:600;transition:all .2s;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.85rem}
        .btn-gold:hover{background:#F59E0B}
        .btn-sm{padding:.35rem .75rem;border-radius:.375rem;font-size:.8rem;font-weight:500;transition:all .2s;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
        .card-glow{position:relative}.card-glow::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(185,28,28,.5),transparent)}
        .card-gold::before{background:linear-gradient(90deg,transparent,rgba(217,119,6,.6),transparent)}
        .fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        #toast-container{position:fixed;top:1rem;right:1rem;z-index:100;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
        .toast{padding:.75rem 1.25rem;border-radius:.5rem;font-size:.875rem;font-weight:500;transform:translateX(120%);transition:transform .3s ease;pointer-events:auto;max-width:340px;border:1px solid}
        .toast.show{transform:translateX(0)}.toast-ok{background:#052e16;border-color:#166534;color:#4ade80}.toast-err{background:#2a0a0a;border-color:#7f1d1d;color:#f87171}.toast-info{background:#1a1400;border-color:#92400e;color:#fbbf24}
        .table-row:hover{background:#1A1A1A}
        @media(max-width:640px){.tab-bar{gap:0}.tab-btn{padding:.6rem .7rem;font-size:.75rem}}

                <div><label class="block text-txt-d text-xs uppercase tracking-wider mb-1.5">Confirmar PIN</label><input id="reg-pin2" type="password" maxlength="4" class="input-field text-center text-lg tracking-[0.5em]" placeholder="****" oninput="this.value=this.value.replace(/\D/g,'')"></div>

<script>
// ============================================================
// CATÁLOGO — EDITA PRECIOS Y PRODUCTOS AQUÍ
// ============================================================
const CATALOGO = [
    { id:1, nombre:"Katana Antigua", precio:500000, desc:"Forjada por maestros artesanos de Seki" },
    { id:2, nombre:"Licencia de Negocio", precio:200000, desc:"Permiso para operar en Kabukicho" },
    { id:3, nombre:"Vehículo Ejecutivo", precio:1500000, desc:"Sedán blindado con matrícula de Shinjuku" },
    { id:4, nombre:"Seguro de Protección", precio:100000, desc:"Cobertura semanal de la familia" },
    { id:5, nombre:"Información Privilegiada", precio:300000, desc:"Datos confidenciales sobre la competencia" },
    { id:6, nombre:"Propiedad en Roppongi", precio:5000000, desc:"Local comercial en zona premium" },
    { id:7, nombre:"Arma de Fuego", precio:800000, desc:"Pistola compacta con munición incluida" },
    { id:8, nombre:"Reunión con el Oyabun", precio:1000000, desc:"Audiencia privada con el jefe de la familia" },
];

// ============================================================
// BASE DE DATOS
// ============================================================
const DB_KEY = 'ryuGinko_v2';
const DEFAULT_DB = {
    users: [{ cuenta:'0001', pin:'admin123', nombre:'Administración', saldo:0, creado:Date.now() }],
    transacciones: [],
    nextId: 1
};

function loadDB() {
    try { const d = localStorage.getItem(DB_KEY); if (d) { const p = JSON.parse(d); if (p && p.users) return p; } } catch(e) {}
    saveDB(JSON.parse(JSON.stringify(DEFAULT_DB)));
    return JSON.parse(JSON.stringify(DEFAULT_DB));
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function exportarDB() { return btoa(unescape(encodeURIComponent(JSON.stringify(loadDB())))); }
function importarDB(code) {
    try {
        const db = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
        if (!db.users || !Array.isArray(db.users) || !db.transacciones) return { error:'Datos corruptos' };
        if (!db.users.find(u => u.cuenta === '0001')) return { error:'Falta cuenta admin' };
        saveDB(db); return { ok:true };
    } catch(e) { return { error:'Código inválido' }; }
}

// ============================================================
// LÓGICA DEL BANCO
// ============================================================
function generarCuenta(db) {
    const usadas = new Set(db.users.map(u => u.cuenta));
    let c; do { c = String(Math.floor(Math.random()*10000)).padStart(4,'0'); } while (usadas.has(c));
    return c;
}

function agregarTx(db, tipo, de, a, cantidad, desc) {
    db.transacciones.push({ id:db.nextId++, tipo, de, a:a||null, cantidad:Math.round(cantidad), desc, fecha:new Date().toISOString() });
    if (db.transacciones.length > 2000) db.transacciones = db.transacciones.slice(-1500);
}

function registrar(nombre, pin) {
    const db = loadDB(); nombre = nombre.trim();
    if (!nombre) return { error:'El nombre es obligatorio' };
    if (!/^\d{4}$/.test(pin)) return { error:'El PIN debe ser exactamente 4 dígitos' };
    const cuenta = generarCuenta(db);
    db.users.push({ cuenta, pin, nombre, saldo:0, creado:Date.now() });
    agregarTx(db, 'registro', '0001', cuenta, 0, 'Registro de ' + nombre);
    saveDB(db); return { ok:true, cuenta };
}

function login(cuenta, pin) {
    const db = loadDB(); const c = cuenta.padStart(4,'0');
    const u = db.users.find(x => x.cuenta === c && x.pin === pin);
    if (!u) return { error:'Cuenta o contraseña incorrectos' };
    return { ok:true, user:u };
}

// Transferencia normal entre dos cuentas (se descuenta del origen)
function transferir(deCuenta, aCuenta, cantidad) {
    const db = loadDB(); const aC = aCuenta.padStart(4,'0');
    if (deCuenta === aC) return { error:'No puedes transferirte a ti mismo' };
    const uFrom = db.users.find(x => x.cuenta === deCuenta);
    const uTo = db.users.find(x => x.cuenta === aC);
    if (!uTo) return { error:'La cuenta destino no existe' };
    cantidad = Math.round(cantidad);
    if (cantidad <= 0) return { error:'La cantidad debe ser mayor a 0' };
    if (uFrom.saldo < cantidad) return { error:'Saldo insuficiente (tenés ' + fYen(uFrom.saldo) + ')' };
    uFrom.saldo -= cantidad; uTo.saldo += cantidad;
    agregarTx(db, 'transferencia', deCuenta, aC, cantidad, uFrom.nombre + ' envió a ' + uTo.nombre);
    saveDB(db); return { ok:true };
}

function comprar(cuenta, itemId) {
    const db = loadDB(); const item = CATALOGO.find(i => i.id === itemId);
    if (!item) return { error:'Producto no encontrado' };
    const u = db.users.find(x => x.cuenta === cuenta);
    if (u.saldo < item.precio) return { error:'Saldo insuficiente' };
    u.saldo -= item.precio;
    agregarTx(db, 'compra', cuenta, null, item.precio, 'Compra: ' + item.nombre);
    saveDB(db); return { ok:true };
}

// Inyectar dinero al sistema (no se descuenta de nadie)
function inyectar(cuenta, cantidad) {
    const db = loadDB(); cantidad = Math.round(cantidad);
    if (cantidad <= 0) return { error:'Cantidad inválida' };
    const u = db.users.find(x => x.cuenta === cuenta);
    if (!u) return { error:'Usuario no encontrado' };
    u.saldo += cantidad;
    agregarTx(db, 'inyeccion', 'SISTEMA', cuenta, cantidad, 'Inyección de fondos a ' + u.nombre);
    saveDB(db); return { ok:true };
}

// Retirar dinero del sistema (no va a ninguna cuenta, desaparece)
function drenar(cuenta, cantidad) {
    const db = loadDB(); cantidad = Math.round(cantidad);
    if (cantidad <= 0) return { error:'Cantidad inválida' };
    const u = db.users.find(x => x.cuenta === cuenta);
    if (!u) return { error:'Usuario no encontrado' };
    if (u.saldo < cantidad) return { error:'Saldo insuficiente' };
    u.saldo -= cantidad;
    agregarTx(db, 'drenaje', cuenta, 'SISTEMA', cantidad, 'Drenaje de fondos de ' + u.nombre);
    saveDB(db); return { ok:true };
}

function eliminarUsuario(cuenta) {
    const db = loadDB();
    if (cuenta === '0001') return { error:'No podés eliminar la cuenta admin' };
    const idx = db.users.findIndex(u => u.cuenta === cuenta);
    if (idx === -1) return { error:'Usuario no encontrado' };
    const u = db.users[idx];
    // Si tiene saldo, se transfiere al admin antes de eliminar
    let detalle = 'Cuenta eliminada: ' + u.nombre;
    if (u.saldo > 0) {
        const admin = db.users.find(x => x.cuenta === '0001');
        admin.saldo += u.saldo;
        detalle += ' (saldo ¥' + u.saldo.toLocaleString('es-ES') + ' recuperado por admin)';
        agregarTx(db, 'transferencia', cuenta, '0001', u.saldo, 'Saldo recuperado al eliminar cuenta');
    }
    agregarTx(db, 'eliminacion', '0001', cuenta, 0, detalle);
    db.users.splice(idx, 1);
    saveDB(db); return { ok:true };
}

// ============================================================
// UTILIDADES
// ============================================================
function fYen(n) { return '¥' + Math.round(n).toLocaleString('es-ES'); }
function fFecha(iso) { const d = new Date(iso); return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'2-digit'}) + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
function fTipo(t) { return { registro:'Registro', transferencia:'Transferencia', compra:'Compra', inyeccion:'Inyección', drenaje:'Drenaje', eliminacion:'Eliminación' }[t] || t; }
function tipoColor(t) { return { registro:'text-green-400', transferencia:'text-blue-400', compra:'text-amber-400', inyeccion:'text-emerald-400', drenaje:'text-orange-400', eliminacion:'text-red-500' }[t] || 'text-txt-m'; }
function tipoIcon(t) { return { registro:'fa-user-plus', transferencia:'fa-arrow-right-arrow-left', compra:'fa-bag-shopping', inyeccion:'fa-syringe', drenaje:'fa-faucet-drip', eliminacion:'fa-user-minus' }[t] || 'fa-circle'; }

function toast(msg, tipo='info') {
    const c = document.getElementById('toast-container'), el = document.createElement('div');
    el.className = 'toast toast-' + tipo; el.textContent = msg; c.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3500);
}

function showModal(title, subtitle, bodyHTML, onConfirm, confirmText='Confirmar', extraClass='') {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-subtitle').textContent = subtitle || '';
    document.getElementById('modal-body').innerHTML = bodyHTML;
    const btn = document.getElementById('modal-confirm');
    btn.textContent = confirmText;
    btn.className = 'btn-primary !py-2 !px-4 !text-sm ' + extraClass;
    btn.onclick = () => { if (onConfirm) onConfirm(); closeModal(); };
    document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
function toggleVis(id, btn) {
    const inp = document.getElementById(id), s = inp.type === 'password';
    inp.type = s ? 'text' : 'password';

let sesion = null, userTab = 'inicio', adminTab = 'control';

function showScreen(n) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('screen-'+n).classList.add('active'); }
function setUserTab(t) { userTab = t; document.querySelectorAll('#screen-user .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); renderUser(); }
function setAdminTab(t) { adminTab = t; document.querySelectorAll('#screen-admin .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === t)); renderAdmin(); }
function cerrarSesion() { sesion = null; document.getElementById('login-cuenta').value=''; document.getElementById('login-pin').value=''; showScreen('login'); }

// ============================================================
// HANDLERS
// ============================================================
function handleLogin() {
    const cuenta = document.getElementById('login-cuenta').value.trim();
    const pin = document.getElementById('login-pin').value.trim();
    if (!cuenta || !pin) return toast('Completa todos los campos','err');
    const res = login(cuenta, pin);
    if (res.error) return toast(res.error,'err');
    sesion = { cuenta:res.user.cuenta, nombre:res.user.nombre, esAdmin:res.user.cuenta==='0001' };
    if (sesion.esAdmin) { setAdminTab('control'); showScreen('admin'); }
    else { document.getElementById('user-nav-name').textContent=res.user.nombre; document.getElementById('user-nav-cuenta').textContent=res.user.cuenta; setUserTab('inicio'); showScreen('user'); }
}

function handleRegister() {
    const nombre=document.getElementById('reg-nombre').value.trim(), pin=document.getElementById('reg-pin').value.trim(), pin2=document.getElementById('reg-pin2').value.trim();
    if (!nombre||!pin||!pin2) return toast('Completa todos los campos','err');
    if (pin!==pin2) return toast('Los PINs no coinciden','err');
    const res = registrar(nombre, pin);
    if (res.error) return toast(res.error,'err');
    toast('Cuenta creada: #' + res.cuenta,'ok');
    document.getElementById('reg-nombre').value=''; document.getElementById('reg-pin').value=''; document.getElementById('reg-pin2').value='';
    showScreen('login'); document.getElementById('login-cuenta').value=res.cuenta;
}

function handleTransferir() {
    const dest=document.getElementById('tf-dest').value.trim(), amt=parseInt(document.getElementById('tf-monto').value);
    if (!dest) return toast('Ingresa la cuenta destino','err');
    if (!amt||amt<=0) return toast('Ingresa una cantidad válida','err');
    showModal('Confirmar transferencia', fYen(amt)+' a cuenta #'+dest.padStart(4,'0'), '<p class="text-txt-d text-sm">Se descontará de tu saldo.</p>', () => {
        const r=transferir(sesion.cuenta,dest,amt);
        if (r.error) return toast(r.error,'err');
        toast('Transferencia realizada','ok');
        document.getElementById('tf-dest').value=''; document.getElementById('tf-monto').value=''; renderUser();
    }, 'Transferir');
}

function handleCompra(itemId) {
    const item=CATALOGO.find(i=>i.id===itemId); if(!item) return;
    showModal('Confirmar compra', item.nombre+' — '+fYen(item.precio), '<p class="text-txt-d text-sm">'+item.desc+'</p>', () => {
        const r=comprar(sesion.cuenta,itemId);
        if(r.error) return toast(r.error,'err');
        toast('Compra realizada: '+item.nombre,'ok'); renderUser();
    }, 'Comprar');
}

            <p class="text-txt-d text-xs mb-3">Genera un código con todos los datos actuales.</p>
            <button onclick="handleExport()" class="btn-gold">Generar código</button>
            <div id="export-result" class="hidden mt-3"><textarea id="export-code" class="input-field text-xs font-mono h-28 resize-none" readonly></textarea><button onclick="copyExport()" class="btn-sm bg-card-alt text-txt-m hover:text-txt mt-2"><i class="fa-solid fa-copy mr-1"></i>Copiar</button></div>
        </div>
        <div class="bg-card border border-bdr rounded-xl p-5 card-glow">
            <h3 class="text-sm font-semibold text-ryu-b mb-3"><i class="fa-solid fa-download mr-2"></i>Importar</h3>
            <p class="text-txt-d text-xs mb-3">Pega un código para reemplazar los datos locales.</p>
            <textarea id="import-code" class="input-field text-xs font-mono h-28 resize-none mb-3" placeholder="Pega el código aquí..."></textarea>
            <button onclick="handleImport()" class="btn-primary !text-sm">Importar y reemplazar</button>
        </div>
        <div class="bg-red-900/10 border border-red-900/30 rounded-lg p-4 mt-4"><p class="text-red-400 text-xs"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Importar reemplaza toda la base de datos local.</p></div>`;
    }
}

function handleExport() { document.getElementById('export-code').value=exportarDB(); document.getElementById('export-result').classList.remove('hidden'); toast('Código generado','ok'); }
function copyExport() { navigator.clipboard.writeText(document.getElementById('export-code').value).then(()=>toast('Copiado','ok')).catch(()=>{document.getElementById('export-code').select();document.execCommand('copy');toast('Copiado','ok');}); }
function handleImport() { const c=document.getElementById('import-code').value.trim(); if(!c) return toast('Pega un código primero','err'); const r=importarDB(c); if(r.error) return toast(r.error,'err'); toast('Datos importados','ok'); document.getElementById('import-code').value=''; renderAdmin(); }

// Enter para acceder
document.addEventListener('keydown', e => {
    if(e.key!=='Enter') return;
    if(document.getElementById('screen-login').classList.contains('active')) handleLogin();
    else if(document.getElementById('screen-register').classList.contains('active')) handleRegister();
});

// Init — fuerza reset si es la primera vez con esta versión
loadDB(); showScreen('login');
</script>
</body>
</html>
